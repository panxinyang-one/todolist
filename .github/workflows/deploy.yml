name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (PM2 + Nginx, no Docker)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then DEPLOY_PATH="/var/www/todolist"; fi
            cd "$DEPLOY_PATH"

            git pull origin main

            cd client
            npm ci
            npm run build
            cd ..

            cd server
            npm ci
            npm run build
            cd ..

            pm2 startOrReload deploy/ecosystem.config.cjs --update-env
            pm2 save
